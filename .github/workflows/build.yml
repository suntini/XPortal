name: Build XPortal DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Create Dummy Environment.props
      shell: powershell
      run: |
        $propsContent = @"
        <Project>
          <PropertyGroup>
            <VALHEIM_INSTALL>C:\DummyPath</VALHEIM_INSTALL>
          </PropertyGroup>
        </Project>
        "@
        $propsContent | Out-File -FilePath "Environment.props" -Encoding utf8

    - name: Restore NuGet Packages
      run: nuget restore XPortal.sln

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: msbuild XPortal.sln /p:Configuration=Release /p:BuildingInsideGitHubActions=true

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XPortal-Mod-DLL
        path: |
          **/bin/Release/**/XPortal.dll
          **/bin/Release/**/*.dll
