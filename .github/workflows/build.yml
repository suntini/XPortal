name: Build XPortal DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 1. 模拟 Environment.props，避免缺失游戏安装目录导致报错
    - name: Create Dummy Environment.props
      shell: powershell
      run: |
        $propsContent = @"
        <Project>
          <PropertyGroup>
            <VALHEIM_INSTALL>C:\DummyPath</VALHEIM_INSTALL>
          </PropertyGroup>
        </Project>
        "@
        $propsContent | Out-File -FilePath "Environment.props" -Encoding utf8

    # 2. 安装并解压 JotunnLib 到项目的 packages 目录下，确保 .props 和 .targets 文件到位
    - name: Restore Jotunn Package
      shell: powershell
      run: |
        nuget install JotunnLib -Version 2.30.0 -OutputDirectory packages

    # 3. 执行项目还原与构建
    - name: Restore Project Dependencies
      run: nuget restore XPortal.sln

    - name: Build Project
      run: msbuild XPortal.sln /p:Configuration=Release /p:BuildingInsideGitHubActions=true

    # 4. 收集编译生成的 DLL
    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XPortal-Mod-DLL
        path: |
          **/bin/Release/**/XPortal.dll
          **/bin/Release/**/*.dll
